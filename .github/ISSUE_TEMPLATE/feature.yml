name: Feature request
description: Suggest an idea or a platform to integrate
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: input
    id: platform
    attributes:
      label: Platform involved (if any)
      placeholder: MyCourseVille, Grader, Talent Journey, ...
