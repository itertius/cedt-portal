name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Where
      description: URL (hub or dev.hub), browser, OS
  - type: markdown
    attributes:
      value: "Security issue? Do not file it here. See SECURITY.md."
