name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cedt
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cedt_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cedt -d cedt_hub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cedt@localhost:5432/cedt_hub
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - name: Migrations are up to date with the schema
        run: |
          pnpm --filter @cedt-hub/db exec drizzle-kit generate --name ci-check
          git diff --exit-code --stat packages/db/migrations || {
            echo "::error::Schema changed without a migration. Run pnpm db:generate."; exit 1; }
          test -z "$(git status --porcelain packages/db/migrations)" || {
            echo "::error::Schema changed without a migration. Run pnpm db:generate."; exit 1; }
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @cedt-hub/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, every phase)
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev or hotfix/* may merge into master
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PRs from forks must target dev, not master."
            exit 1
          fi
          case "$HEAD_REF" in
            dev|hotfix/*) echo "OK: $HEAD_REF -> master" ;;
            *) echo "::error::'$HEAD_REF' cannot merge into master. Open the PR against dev." ; exit 1 ;;
          esac
